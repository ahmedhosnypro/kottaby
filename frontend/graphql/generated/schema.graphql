"""Input fields required to create a new subscription plan."""
input CreatePlanInput {
  """3-letter uppercase currency code (e.g. 'EGP')."""
  currency: String!

  """Plan duration in days (integer >= 1)."""
  intervalDays: Int!

  """Exact price formatted as numeric string (e.g. '150.00')."""
  price: String!

  """Total sessions included (integer >= 1)."""
  sessionCount: Int!

  """Plan title (1..255 characters)."""
  title: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

enum Gender {
  Female
  Male
  Other
}

type HandshakeCodeLookup {
  linkable: Boolean!
  maskedName: String!
}

type HealthCheck {
  service: String!
  status: String!
  timestamp: String!
  version: String!
}

type LoginPayload {
  """
  Short-lived access token (15 min). Store in React memory; NEVER set as a cookie.
  """
  accessToken: String!

  """
  Long-lived refresh token (7 days). Also set as an httpOnly cookie by the route handler.
  """
  refreshToken: String!

  """The authenticated user."""
  user: User!
}

type LogoutPayload {
  """Whether the logout succeeded (always true — public mutation)."""
  success: Boolean!
}

type Mutation {
  adminCreateUser(input: AdminCreateUserInput!): AdminUserDetail!
  adminSetUserDeleted(deleted: Boolean!, id: Int!): AdminUserDetail!
  adminUpdateUser(id: Int!, input: AdminUpdateUserInput!): AdminUserDetail!

  """Creates a new subscription plan in the catalog (Admin only)."""
  createPlan(
    """Input fields for the new subscription plan."""
    input: CreatePlanInput!
  ): Plan!

  """
  Authenticate with email + password. Returns the authenticated user + access + refresh tokens. The access_token + refresh_token + session_id are also set as httpOnly cookies.
  """
  login(email: String!, password: String!): LoginPayload!

  """
  Clears the access_token + refresh_token + session_id httpOnly cookies. Public — callable with an expired token. Always returns { success: true }.
  """
  logout: LogoutPayload!

  """
  Marks every unread notification of the caller read (optionally narrowed to one type) and returns the affected-row count. An empty matching set returns 0; repeat sweeps are idempotent (0).
  """
  markAllNotificationsRead(type: NotificationType): Int!

  """
  Marks one of the caller's own notifications read (idempotent) and returns the row. A foreign or nonexistent id is indistinguishable — NOTIFICATION_NOT_FOUND with no existence oracle.
  """
  markNotificationRead(id: ID!): Notification!

  """
  Rotate the JWT pair from a valid refresh token. Returns fresh access + refresh tokens. The new access_token + refresh_token + session_id are also set as httpOnly cookies (rotation invalidates the prior pair).
  """
  refreshToken(refreshToken: String!): RefreshTokenPayload!
  registerUser(input: RegisterUserInput!): User!

  """Activates or deactivates an existing subscription plan (Admin only)."""
  setPlanActiveStatus(
    """ID of the subscription plan."""
    id: ID!

    """Target active state for the plan."""
    isActive: Boolean!
  ): Plan!

  """
  Persists the caller's app locale preference (UI + notification-copy language) and returns the updated user. Idempotent. Self-scoped — identity is derived from the verified context, never from arguments.
  """
  updateMyLocale(locale: AppLocale!): User!

  """Updates mutable fields on an existing subscription plan (Admin only)."""
  updatePlan(
    """ID of the subscription plan to update."""
    id: ID!

    """Updated fields for the subscription plan."""
    input: UpdatePlanInput!
  ): Plan!
}

input MyNotificationsFilterInput {
  isRead: Boolean
  limit: Int
  offset: Int
  type: NotificationType
}

type Notification {
  body: String
  createdAt: String!
  id: ID!
  isRead: Boolean!
  relatedEntityId: Int
  relatedEntityType: String
  title: String!
  type: NotificationType!
}

type NotificationListPage {
  hasMore: Boolean!
  items: [Notification!]!
  totalCount: Int!
}

enum NotificationType {
  EvaluationResult
  ParentLinkRequest
  PaymentConfirmation
  SessionCancellation
  SessionCompletion
  SessionRequest
  SystemBroadcast
}

"""A subscription plan in the Kottaby catalog."""
type Plan {
  """Timestamp when the plan record was created."""
  createdAt: String!

  """Three-letter ISO currency code (e.g. EGP, USD)."""
  currency: String!

  """Timestamp when the plan was deactivated, or null if currently active."""
  deactivatedAt: String

  """Unique plan identifier (Apollo cache normalization key)."""
  id: ID!

  """Duration of the billing/service cycle in days."""
  intervalDays: Int!

  """
  Flag indicating whether this plan is actively offered in the student catalog.
  """
  isActive: Boolean!

  """Plan price represented as an exact decimal string."""
  price: String!

  """Number of lesson sessions included in this plan."""
  sessionCount: Int!

  """Human-readable title of the subscription plan."""
  title: String!

  """Timestamp when the plan record was last modified."""
  updatedAt: String!
}

type Query {
  _health: HealthCheck!

  """Admin-only query to list plans, optionally including inactive plans."""
  adminPlans(
    """Whether to include deactivated plans in the returned list."""
    includeInactive: Boolean = true
  ): [Plan!]!
  adminUserActivity(id: Int!, limit: Int): [AdminUserActivityEntry!]!
  adminUserDetail(id: Int!): AdminUserDetail!
  adminUserStats: AdminUserStats!
  adminUsers(filters: AdminUserFiltersInput, page: Int, pageSize: Int): AdminUserPage!
  findStudentByHandshakeCode(code: String!): HandshakeCodeLookup

  """
  Returns the authenticated user (or null for anonymous). Anonymous callers receive null — the AuthProvider uses this to detect expired access tokens and silently restore the session via `refreshToken`.
  """
  me: User
  myApplicantProfile: ApplicantProfile
  myHandshakeCode: String!

  """
  One page of the caller's own inbox — items (newest first), totalCount, hasMore. Optional conjunctive filters (type, isRead) and page window (limit 1..50 default 20, offset default 0).
  """
  myNotifications(filter: MyNotificationsFilterInput): NotificationListPage!

  """
  The caller's unread notification count — the badge read (0 for an all-read or empty inbox).
  """
  myUnreadNotificationCount: Int!

  """Returns the active subscription plans catalog for authenticated users."""
  planCatalog: [Plan!]!

  """
  Returns the canonical list of recitation readings (Qira'at) for the registration form selector. Public — no authentication required. The values are stable API identifiers; display labels are resolved client-side via the i18n recitation namespace.
  """
  recitationReadings: [RecitationReading!]!
}

enum RecitationReading {
  AL_BAZZI_AN_IBN_KATHIR
  AL_DURI_AN_ABI_AMR
  AL_SUSI_AN_ABI_AMR
  HAFS_AN_ASIM
  KHALAF_AN_HAMZAH
  KHALLAD_AN_ASIM
  QALUN_AN_NAFI
  QUNBUL_AN_IBN_KATHIR
  SHUBAH_AN_ASIM
  WARSH_AN_NAFI
}

type RefreshTokenPayload {
  """Fresh short-lived access token (15 min)."""
  accessToken: String!

  """
  Fresh long-lived refresh token (7 days). Also set as an httpOnly cookie by the route handler (rotation).
  """
  refreshToken: String!
}

enum RegisterPublicRole {
  Parent
  Student
  Teacher
}

input RegisterUserInput {
  country: String!
  email: String!
  fullName: String!
  gender: Gender
  password: String!
  phone: String!
  preferredRecitation: RecitationReading
  role: RegisterPublicRole!
}

"""Mutable fields for updating an existing subscription plan."""
input UpdatePlanInput {
  """Updated currency code."""
  currency: String

  """Updated duration in days."""
  intervalDays: Int

  """Updated price string."""
  price: String

  """Updated session count."""
  sessionCount: Int

  """Updated plan title."""
  title: String
}

type User {
  country: String
  email: String!
  fullName: String!
  gender: Gender
  id: Int!
  isBlocked: Boolean!
  isDeleted: Boolean!
  locale: AppLocale
  phone: String

  """
  The user's preferred recitation reading (Qira'ah), selected during registration. Contract metadata — not persisted to the session-linked `recitation` table (C.5).
  """
  preferredRecitation: RecitationReading
  role: UserRole!
  suspended: Boolean!
}

enum UserRole {
  Admin
  Parent
  Student
  Teacher
}