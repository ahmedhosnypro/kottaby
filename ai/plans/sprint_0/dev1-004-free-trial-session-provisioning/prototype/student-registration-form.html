<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kottaby - Student Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Serif:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#343943",
                        "surface-container-high": "#252a34",
                        "surface-container-lowest": "#090e17",
                        "on-secondary-fixed-variant": "#544600",
                        "secondary-fixed-dim": "#e9c400",
                        "outline": "#99907c",
                        "on-primary-container": "#554300",
                        "on-primary": "#3c2f00",
                        "surface-container": "#1b2029",
                        "primary": "#f2ca50",
                        "primary-container": "#d4af37",
                        "on-secondary": "#3a3000",
                        "on-secondary-container": "#725f00",
                        "tertiary": "#c6cee3",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "on-surface-variant": "#d0c5af",
                        "on-primary-fixed-variant": "#574500",
                        "surface-tint": "#e9c349",
                        "surface": "#0e131c",
                        "tertiary-fixed-dim": "#bec7db",
                        "on-secondary-fixed": "#221b00",
                        "secondary": "#fff9ef",
                        "primary-fixed": "#ffe088",
                        "on-tertiary": "#283140",
                        "secondary-fixed": "#ffe16d",
                        "surface-container-highest": "#30353f",
                        "surface-dim": "#0e131c",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "surface-container-low": "#171c25",
                        "inverse-on-surface": "#2c303a",
                        "primary-fixed-dim": "#e9c349",
                        "tertiary-container": "#aab3c7",
                        "outline-variant": "#4d4635",
                        "on-tertiary-container": "#3c4556",
                        "tertiary-fixed": "#dae3f7",
                        "on-tertiary-fixed": "#131c2a",
                        "on-surface": "#dee2ef",
                        "on-tertiary-fixed-variant": "#3e4758",
                        "on-background": "#dee2ef",
                        "inverse-surface": "#dee2ef",
                        "background": "#0e131c",
                        "inverse-primary": "#735c00",
                        "surface-variant": "#30353f",
                        "on-primary-fixed": "#241a00",
                        "secondary-container": "#ffdb3c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "container-max": "1200px",
                        "unit": "8px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Noto Serif"],
                        "label-sm": ["Hanken Grotesk"],

                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "arabic-display": ["40px", { "lineHeight": "1.8", "fontWeight": "400" }]

<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .arabic-text {
            font-family: 'Noto Serif', serif;
        }
        
        /* Subtle glowing background effects */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
        }

        .glass-card {
            background: rgba(23, 28, 37, 0.6); /* surface-container-low with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.05);
        }

        .input-glass {
            background: rgba(9, 14, 23, 0.8); /* surface-container-lowest */
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary'), 0 0 15px rgba(212, 175, 55, 0.1);
            outline: none;
        }

        .role-card {
            background: rgba(48, 53, 63, 0.4); /* surface-variant */
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .role-card:hover {
            background: rgba(48, 53, 63, 0.7);
            border-color: rgba(212, 175, 55, 0.3);
        }
        .role-card.active {
            background: rgba(212, 175, 55, 0.1); /* primary-container with low opacity */
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05);
        }

        /* Material Icons setup */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="antialiased">
<div class="glow-bg"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-[0_8px_32px_rgba(212,175,55,0.1)]">
<div class="flex items-center gap-4">
<img alt="Kottaby Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHgNq-B5s9ifl86jDI4pPVI9FnPj4k9lGZ57vriWhGGb9EJLyNqHf0nJlDfiHd92GBTrHFGymJG6WFZKfwxKZ8lnoEBcTsVq1p8dkY-fGy7NH_ubrijbD1AcCYsfMc_vnopJm9_mHBipXG2v2ynS0Z9fEyiMhWI9KXTOgIUgx4m2rqWdbk9ccH18RnEhwDiEy0jqJBtt4c6eNWT2NO508hC0orKq9c_KE9MV8BzscsTSN_DGuFRaEqxkthH8BPW4E6lrDi26d9dd58"/>
<span class="font-headline-lg text-primary tracking-tight hidden sm:block arabic-text">Kottaby</span>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary-container transition-colors cursor-pointer active:scale-95 px-3 py-2 rounded-lg border border-white/10 bg-surface-container-low/50">
<span class="material-symbols-outlined text-lg" data-icon="language">language</span>
<span class="font-label-sm uppercase tracking-wider arabic-text">EN / العربية</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-32 pb-20 px-margin-mobile md:px-margin-desktop flex justify-center items-center min-h-screen">
<div class="w-full max-w-2xl glass-card rounded-2xl p-6 md:p-10 relative overflow-hidden">
<!-- Decorative corner accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-bl-full blur-2xl pointer-events-none"></div>
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface mb-2 arabic-text">إنشاء حساب جديد</h1>
<p class="font-body-md text-on-surface-variant">Create your account to begin your journey</p>
</div>
<form class="space-y-8">
<!-- Role Selector -->
<div class="space-y-4">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider block arabic-text">Select Role / اختر الدور</label>
<div class="grid grid-cols-3 gap-3 md:gap-4">
<!-- Active Role: Student -->
<div class="role-card active rounded-xl p-4 flex flex-col items-center justify-center gap-2 text-primary" onclick="selectRole(this)">
<span class="material-symbols-outlined text-3xl icon-fill" data-icon="school">school</span>
<span class="font-body-md font-semibold arabic-text">طالب</span>
<span class="text-[11px] opacity-70">Student</span>
</div>
<!-- Role: Teacher -->
<div class="role-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface" onclick="selectRole(this)">
<span class="material-symbols-outlined text-3xl" data-icon="menu_book">menu_book</span>
<span class="font-body-md font-semibold arabic-text">معلم</span>
<span class="text-[11px] opacity-70">Teacher</span>
</div>
<!-- Role: Parent -->
<div class="role-card rounded-xl p-4 flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:text-on-surface" onclick="selectRole(this)">
<span class="material-symbols-outlined text-3xl" data-icon="family_restroom">family_restroom</span>
<span class="font-body-md font-semibold arabic-text">ولي أمر</span>
<span class="text-[11px] opacity-70">Parent</span>
</div>
</div>
</div>
<hr class="border-white/5"/>
<!-- Form Fields -->
<div class="space-y-5">
<div>
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block arabic-text">رواية القراءة المفضلة / Preferred Recitation</label>
<div class="relative">
<select class="w-full input-glass rounded-lg py-3 px-4 font-body-md text-on-surface appearance-none pr-10 arabic-text" dir="rtl">
<option selected="" value="hafs">حفص عن عاصم (Hafs)</option>
<option value="warsh">ورش عن نافع (Warsh)</option>
<option value="qaloon">قالون عن نافع (Qaloon)</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block arabic-text">الاسم الكامل / Full Name</label>
<input class="w-full input-glass rounded-lg py-3 px-4 font-body-md text-on-surface placeholder:text-outline-variant" dir="auto" placeholder="John Doe / فلان الفلاني" type="text"/>
</div>
<div>
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block arabic-text">البريد الإلكتروني / Email</label>
<input class="w-full input-glass rounded-lg py-3 px-4 font-body-md text-on-surface placeholder:text-outline-variant text-left" dir="ltr" placeholder="student@example.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block arabic-text">كلمة المرور / Password</label>
<input class="w-full input-glass rounded-lg py-3 px-4 font-body-md text-on-surface placeholder:text-outline-variant text-left" dir="ltr" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block arabic-text">تأكيد كلمة المرور / Confirm Password</label>
<input class="w-full input-glass rounded-lg py-3 px-4 font-body-md text-on-surface placeholder:text-outline-variant text-left" dir="ltr" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Promo Chip -->
<div class="bg-primary/10 border border-primary/30 rounded-full py-2 px-4 flex items-center justify-center gap-2 mx-auto w-fit">
<span class="material-symbols-outlined text-primary text-sm icon-fill" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-sm text-primary arabic-text text-center">جلسة تجريبية مجانية عند التسجيل! / Get 1 FREE trial session when you sign up</span>
</div>
<!-- CTA -->
<button class="w-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-headline-lg-mobile py-4 rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.3)] hover:shadow-[0_0_30px_rgba(212,175,55,0.5)] transition-all active:scale-[0.98] arabic-text mt-8 flex justify-center items-center gap-2" type="button">
<span>سجّل الآن / Register now</span>
<span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-on-surface-variant mt-4 arabic-text">
                    لديك حساب بالفعل؟ <a class="text-primary hover:underline" href="#">تسجيل الدخول / Login</a>
</p>
</form>
</div>
</main>
<script>
        function selectRole(element) {
            // Remove active class from all role cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active', 'text-primary');
                card.classList.add('text-on-surface-variant');
                const icon = card.querySelector('.material-symbols-outlined');
                icon.classList.remove('icon-fill');
            });

            // Add active class to clicked card
            element.classList.add('active', 'text-primary');
            element.classList.remove('text-on-surface-variant');
            const icon = element.querySelector('.material-symbols-outlined');
            icon.classList.add('icon-fill');
        }
    </script>
</body></html>
